{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>Edit Dashboard</h1>
    <form method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ dashboard.title }}" required>
        <br>
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ dashboard.description }}</textarea>
        <br>
        <label for="is_public">Public</label>
        <input type="checkbox" id="is_public" name="is_public" {% if dashboard.is_public %}checked{% endif %}>
        <br>
        <button type="submit">Save Changes</button>
    </form>
    <a href="{{ url_for('main.view_dashboard', dashboard_id=dashboard.id) }}">Cancel</a>
{% endblock %}
